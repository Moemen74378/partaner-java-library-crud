spring.application.name=library-desk
server.address=127.0.0.1
server.port=8080

# File-backed H2 keeps books when the application is restarted.
spring.datasource.url=jdbc:h2:file:./data/library;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# The database marker prevents sample books from returning after you delete them.
app.seed-data=true
